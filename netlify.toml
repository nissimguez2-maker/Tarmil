# Tarmil — Netlify deploy config

[build]
  command = "npm run build"
  publish = "dist"

# Pin Node so the build env stays consistent with local. Without this,
# Netlify's default Node version (currently 18) drifts and tsc-b can disagree
# with a Node 22 local build over lib defaults.
[build.environment]
  NODE_VERSION = "22.22.2"

# SPA fallback — every path serves index.html so client-side routes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA correctness: ensure the manifest is served with the right MIME type.
# (Netlify infers this from the .webmanifest extension; making it explicit
# guards against accidental rename to .json which silences install prompts.)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
